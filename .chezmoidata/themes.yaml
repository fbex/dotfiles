# ── Active theme ────────────────────────────────────────────────
# Switch here, then `chezmoi apply`. Must match a key under `themes:`.
theme: ayu-dark

# ── Catalog ─────────────────────────────────────────────────────
# One block per theme. One key per tool, holding that tool's own
# name for the theme (they all differ). `fzf` has no named themes,
# so it holds the literal --color string.
themes:
  catppuccin-mocha:
    ghostty: Catppuccin Mocha
    bat: Catppuccin Mocha
    nvim: catppuccin-mocha
    yazi: catppuccin-mocha
    starship: catppuccin_mocha
    eza: catppuccin-mocha
    fzf: >-
      --color=bg+:#313244,bg:#1E1E2E,spinner:#F5E0DC,hl:#F38BA8
      --color=fg:#CDD6F4,header:#F38BA8,info:#CBA6F7,pointer:#F5E0DC
      --color=marker:#B4BEFE,fg+:#CDD6F4,prompt:#CBA6F7,hl+:#F38BA8
      --color=selected-bg:#45475A
      --color=border:#6C7086,label:#CDD6F4

  catppuccin-macchiato:
    ghostty: Catppuccin Macchiato
    bat: Catppuccin Macchiato
    nvim: catppuccin-macchiato
    yazi: catppuccin-macchiato
    starship: catppuccin_macchiato
    eza: catppuccin-macchiato
    fzf: >-
      --color=bg+:#363A4F,bg:#24273A,spinner:#F4DBD6,hl:#ED8796
      --color=fg:#CAD3F5,header:#ED8796,info:#C6A0F6,pointer:#F4DBD6
      --color=marker:#B7BDF8,fg+:#CAD3F5,prompt:#C6A0F6,hl+:#ED8796
      --color=selected-bg:#494D64
      --color=border:#6E738D,label:#CAD3F5

  catppuccin-frappe:
    ghostty: Catppuccin Frappe
    bat: Catppuccin Frappe
    nvim: catppuccin-frappe
    yazi: catppuccin-frappe
    starship: catppuccin_frappe
    eza: catppuccin-frappe
    fzf: >-
      --color=bg+:#414559,bg:#303446,spinner:#F2D5CF,hl:#E78284
      --color=fg:#C6D0F5,header:#E78284,info:#CA9EE6,pointer:#F2D5CF
      --color=marker:#BABBF1,fg+:#C6D0F5,prompt:#CA9EE6,hl+:#E78284
      --color=selected-bg:#51576D
      --color=border:#737994,label:#C6D0F5

  catppuccin-latte:
    ghostty: Catppuccin Latte
    bat: Catppuccin Latte
    nvim: catppuccin-latte
    yazi: catppuccin-latte
    starship: catppuccin_latte
    eza: catppuccin-latte
    fzf: >-
      --color=bg+:#CCD0DA,bg:#EFF1F5,spinner:#DC8A78,hl:#D20F39
      --color=fg:#4C4F69,header:#D20F39,info:#8839EF,pointer:#DC8A78
      --color=marker:#7287FD,fg+:#4C4F69,prompt:#8839EF,hl+:#D20F39
      --color=selected-bg:#BCC0CC
      --color=border:#9CA0B0,label:#4C4F69

  onedark:
    ghostty: Atom One Dark
    bat: TwoDark              # closest built-in; no true One Dark tmTheme
    nvim: onedark
    nvim_plugin: navarasu/onedark.nvim   # optional: only for themes LazyVim lacks
    yazi: onedark
    starship: onedark
    eza: onedark
    fzf: >-
      --color=bg+:#2C313C,bg:#21252B,spinner:#56B6C2,hl:#E06C75
      --color=fg:#ABB2BF,header:#E06C75,info:#C678DD,pointer:#56B6C2
      --color=marker:#98C379,fg+:#D7DAE0,prompt:#C678DD,hl+:#E06C75
      --color=selected-bg:#3E4451
      --color=border:#4B5263,label:#ABB2BF

  ayu-dark:
    ghostty: Ayu
    bat: ayu                  # vendored tmTheme, from the yazi flavor
    nvim: ayu-dark
    nvim_plugin: Shatur/neovim-ayu       # optional: only for themes LazyVim lacks
    yazi: ayu-dark
    starship: ayu_dark
    eza: ayu-dark
    fzf: >-
      --color=bg+:#1C2733,bg:#0B0E14,spinner:#95E6CB,hl:#F07178
      --color=fg:#BFBDB6,header:#F07178,info:#D2A6FF,pointer:#95E6CB
      --color=marker:#AAD94C,fg+:#BFBDB6,prompt:#D2A6FF,hl+:#F07178
      --color=selected-bg:#253340
      --color=border:#565B66,label:#BFBDB6

  # To add a theme: copy a block, fill in each tool's own name, then
  # install its assets (see .chezmoidata/README.md).
  # tokyonight-night:
  #   ghostty: tokyonight
  #   bat: tokyonight_night
  #   nvim: tokyonight-night
  #   yazi: tokyonight
  #   starship: tokyonight_night
  #   eza: tokyonight
  #   fzf: >-
  #     --color=bg+:#292e42,bg:#1a1b26,fg:#c0caf5,hl:#f7768e
